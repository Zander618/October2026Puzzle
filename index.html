<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>October 2026 Puzzle</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="quiz-container">

    <header class="quiz-header">
      <div class="pumpkin">🎃</div>

      <h1>October Puzzle</h1>

      <p>Answer the questions... if you dare.</p>

      <div id="progress" class="progress">
        0 / 30 completed
      </div>
    </header>

    <form id="quiz-form">

      <div id="questions"></div>

      <button type="submit">
        Save Progress
      </button>

    </form>

    <p id="result"></p>

  </main>

  <script src="script.js"></script>
</body>
</html>
